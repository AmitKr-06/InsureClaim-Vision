[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "insureclaim"
version = "0.0.1"
description = "Motor claims damage assessment, fraud screening and adjuster platform"
authors = [
  { name = "Amit Kumar" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["insureclaim"]
include = ["pyproject.toml", "insureclaim/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["insureclaim"]
force-sort-within-sections = true

